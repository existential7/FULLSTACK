<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 6.2</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="shell">
        <header>
            <h1>Experiment 6.2</h1>
            <p>Caching &amp; Query Optimization</p>
        </header>

        <section class="panel">
            <h2>Add User</h2>
            <form id="userForm" class="form-row">
                <div><label>UID</label><input id="uid" type="text" required></div>
                <div><label>Name</label><input id="name" type="text" required></div>
                <div><label>City</label><input id="city" type="text" required></div>
                <div><label>Country</label><input id="country" type="text" required></div>
                <button type="submit" class="add">Add User</button>
            </form>
        </section>

        <section class="panel">
            <h2>Query Optimization Tests</h2>
            <div class="button-row">
                <button type="button" class="c1" onclick="loadUsers('normal')">Normal Query</button>
                <button type="button" class="c2" onclick="loadUsers('optimized')">JOIN FETCH</button>
                <button type="button" class="c3" onclick="loadUsers('cached')">Cached Query</button>
                <button type="button" class="c4" onclick="loadUsers('native')">Native SQL</button>
            </div>
        </section>

        <section class="panel">
            <h2>Sort Users</h2>
            <div class="button-row">
                <button type="button" class="c5" onclick="loadUsers('sort-id')">Sort by ID</button>
                <button type="button" class="c5" onclick="loadUsers('sort-name')">Sort by Name</button>
                <button type="button" class="c6" onclick="loadUsers('cached')">Refresh</button>
            </div>
        </section>

        <div id="status"></div>

        <section class="panel">
            <h2>User List</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>UID</th><th>Name</th><th>City</th><th>Country</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
