<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 6.1</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="shell">
        <header>
            <h1>Experiment 6.1</h1>
            <p>Pagination &amp; Sorting REST API</p>
        </header>

        <section class="panel">
            <h2>Add User</h2>
            <form id="userForm" class="split">
                <div>
                    <label for="uid">UID</label>
                    <input id="uid" type="text" required>
                </div>
                <div>
                    <label for="name">Name</label>
                    <input id="name" type="text" required>
                </div>
                <button type="submit" class="add">Add User</button>
            </form>
        </section>

        <section class="panel">
            <h2>Pagination &amp; Sorting</h2>
            <div class="split three">
                <div>
                    <label for="pageSize">Users Per Page</label>
                    <select id="pageSize">
                        <option value="3">3</option>
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <div>
                    <label for="sortField">Sort By</label>
                    <select id="sortField">
                        <option value="uid">UID</option>
                        <option value="name">Name</option>
                    </select>
                </div>
                <div>
                    <label for="sortDirection">Order</label>
                    <select id="sortDirection">
                        <option value="asc">Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </div>
            </div>
            <button type="button" class="apply" onclick="loadUsers(0)">Apply</button>
        </section>

        <section class="panel">
            <div class="bar">
                <div>
                    <h2>Users</h2>
                    <p id="totalInfo">Total Users: 0</p>
                </div>
                <button type="button" class="refresh" onclick="loadUsers(currentPage)">Refresh</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>UID</th><th>Name</th><th>Action</th></tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
            <div class="pager">
                <button type="button" id="previousButton" onclick="previousPage()">Previous</button>
                <span id="pageInfo">Page 1</span>
                <button type="button" id="nextButton" onclick="nextPage()">Next</button>
            </div>
        </section>
        <div id="message" class="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
